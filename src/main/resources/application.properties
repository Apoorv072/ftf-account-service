spring.application.name=account-service
server.port=8081


#DB
#spring.datasource.url= url
#spring.datasource.username= username
#spring.datasource.password= password
#spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=FTF_Account_DB;encrypt=true;trustServerCertificate=true
spring.datasource.url=jdbc:sqlserver://host.docker.internal:1433;databaseName=FTF_Account_DB;encrypt=true;trustServerCertificate=true
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

#Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect

#Redis
#spring.data.redis.host=localhost
spring.data.redis.host=ftf-redis
spring.data.redis.port=6379

#Kafka
spring.kafka.bootstrap-servers=ftf-kafka:7071

# Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
#spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=true
spring.kafka.producer.properties.spring.json.type.mapping=accountCreated:com.ftf.account_service.Dto.AccountCreatedEvent,notificationGenerated:com.ftf.account_service.Dto.GenerateNotificationEvent

#debug=true

